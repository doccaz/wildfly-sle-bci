name: Build and publish image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  load-matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.load.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: load
        run: echo "versions=$(jq -c . versions.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: load-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-matrix.outputs.versions) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags for WildFly ${{ matrix.wildfly_version }}
        id: tags
        run: |
          img="${REGISTRY}/${IMAGE_NAME}"
          {
            echo "tags<<EOF"
            echo "${img}:${{ matrix.wildfly_version }}"
            echo "${img}:${{ matrix.minor }}"
            echo "${img}:${{ matrix.major }}"
            if [ "${{ matrix.latest }}" = "true" ]; then
              echo "${img}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push WildFly ${{ matrix.wildfly_version }}
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            WILDFLY_VERSION=${{ matrix.wildfly_version }}
            JAVA_TAG=${{ matrix.java_tag }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=wildfly-${{ matrix.major }}
          cache-to: type=gha,mode=max,scope=wildfly-${{ matrix.major }}
